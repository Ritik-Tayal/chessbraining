<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">

<div class="absolute inset-0 bg-gradient-to-b from-transparent via-background/80 to-background"></div>
</div>
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full bg-surface/80 backdrop-blur-xl border-b border-outline-variant/10 flex justify-between items-center px-container-margin h-16 z-50">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-display-mobile text-display-mobile uppercase tracking-tighter text-primary-fixed-dim drop-shadow-[0_0_8px_rgba(0,218,243,0.5)]">CHESS BRAINING</span>
</div>
<div class="flex items-center gap-md">
<div class="flex flex-col items-end">
<span class="font-label-caps text-label-caps text-secondary-fixed-dim">STREAK</span>
<span class="font-headline-md text-headline-md text-primary leading-none">12</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">settings</button>
</div>
</header>
<!-- Main Brain Round Canvas -->
<main class="relative z-10 flex-1 flex flex-col pt-20 pb-md px-container-margin max-w-md mx-auto w-full">
<!-- Brain Round Header -->
<div class="text-center mb-md">
<div class="inline-flex items-center gap-xs px-sm py-base rounded-full bg-secondary-container/20 border border-secondary-container/40 mb-xs">
<span class="material-symbols-outlined text-secondary text-sm brain-pulse" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest">Brain Round Active</span>
</div>
<!-- Timer Bar -->
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden mt-sm">
<div class="timer-progress h-full bg-gradient-to-r from-primary-fixed-dim to-secondary-container w-full shadow-[0_0_10px_rgba(0,218,243,0.5)]" id="timer-bar"></div>
</div>
<div class="flex justify-between mt-base px-base">
<span class="font-mono-ui text-mono-ui text-outline-variant">TIME REMAINING</span>
<span class="font-headline-md text-headline-md text-primary tabular-nums" id="timer-text">15s</span>
</div>
</div>
<!-- Problem Display Card -->
<div class="glass-panel rounded-xl p-lg mb-lg flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden" id="problem-card">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
<p class="font-label-caps text-label-caps text-primary/60 uppercase mb-xs">SOLVE FOR MAX BOOST</p>
<div class="font-display-mobile text-display-mobile text-on-surface text-5xl mb-sm" id="problem-text">24 × 3 + 12</div>
<div class="w-full max-w-[200px] border-b-2 border-primary/30 h-12 flex items-center justify-center relative">
<span class="font-display-mobile text-display-mobile text-primary tracking-widest min-h-[36px]" id="answer-input"></span>
<div class="w-0.5 h-8 bg-primary animate-pulse ml-xs" id="cursor"></div>
</div>
</div>
<!-- Holographic Num-pad -->
<div class="grid grid-cols-3 gap-gutter flex-1 max-h-[400px]">
<button class="num-key glass-panel rounded-xl flex items-center justify-center font-headline-md text-headline-md text-on-surface hover:border-primary/50 transition-all" onclick="addNumber('1')">1</button>
<button class="num-key glass-panel rounded-xl flex items-center justify-center font-headline-md text-headline-md text-on-surface hover:border-primary/50 transition-all" onclick="addNumber('2')">2</button>
<button class="num-key glass-panel rounded-xl flex items-center justify-center font-headline-md text-headline-md text-on-surface hover:border-primary/50 transition-all" onclick="addNumber('3')">3</button>
<button class="num-key glass-panel rounded-xl flex items-center justify-center font-headline-md text-headline-md text-on-surface hover:border-primary/50 transition-all" onclick="addNumber('4')">4</button>
<button class="num-key glass-panel rounded-xl flex items-center justify-center font-headline-md text-headline-md text-on-surface hover:border-primary/50 transition-all" onclick="addNumber('5')">5</button>

<span class="material-symbols-outlined">backspace</span>
</button>

<div class="fixed bottom-0 w-full px-container-margin pb-safe pt-md z-40 bg-gradient-to-t from-background to-transparent pointer-events-none">

<div class="flex gap-xs">
<div class="glass-panel px-sm py-xs rounded-xl flex flex-col">
<span class="font-label-caps text-[10px] text-outline-variant">ACCURACY</span>
<span class="font-mono-ui text-mono-ui text-tertiary-fixed-dim">98.2%</span>
</div>
</div>
<div class="glass-panel px-md py-xs rounded-full border-tertiary-fixed-dim/30">
<span class="font-label-caps text-label-caps text-tertiary-fixed-dim">SCORE: 2,450</span>
</div>

<!-- Micro-interactions Script -->
<script>
        let timeLeft = 15;
        let currentAnswer = "";
        const expectedAnswer = "84"; // 24 * 3 + 12 = 72 + 12 = 84
        
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const inputDisplay = document.getElementById('answer-input');
        const problemCard = document.getElementById('problem-card');

        // Countdown Timer Logic
        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(timerInterval);
                timerText.innerText = "0s";
                timerBar.style.width = "0%";
                endRound();
            } else {
                timerText.innerText = `${timeLeft}s`;
                timerBar.style.width = `${(timeLeft / 15) * 100}%`;
                
                if (timeLeft <= 5) {
                    timerText.classList.add('text-error');
                    timerBar.classList.replace('from-primary-fixed-dim', 'from-error');
                }
            }
        }, 1000);

        function addNumber(num) {
            if (currentAnswer.length < 5) {
                currentAnswer += num;
                updateDisplay();
                
                // Feedback
                const pulse = document.createElement('div');
                pulse.className = 'absolute inset-0 bg-primary/5 animate-ping rounded-xl pointer-events-none';
                problemCard.appendChild(pulse);
                setTimeout(() => pulse.remove(), 500);
            }
        }

        function clearInput() {
            currentAnswer = currentAnswer.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            inputDisplay.innerText = currentAnswer;
        }

        function checkAnswer() {
            if (currentAnswer === expectedAnswer) {
                // Success state
                problemCard.classList.add('bg-tertiary-container/10', 'border-tertiary-container');
                inputDisplay.classList.add('text-tertiary-fixed-dim');
                setTimeout(() => {
                    nextProblem();
                }, 500);
            } else {
                // Error state
                problemCard.classList.add('shake', 'border-error');
                inputDisplay.classList.add('text-error');
                setTimeout(() => {
                    problemCard.classList.remove('shake', 'border-error');
                    inputDisplay.classList.remove('text-error');
                    currentAnswer = "";
                    updateDisplay();
                }, 400);
            }
        }

        function nextProblem() {
            // In a real app, generate new problem
            alert("Correct! Neural boost activated.");
            location.reload(); // Simple reset for demo
        }

        function endRound() {
            problemCard.innerHTML = `
                <div class="text-center">
                    <span class="material-symbols-outlined text-5xl text-secondary mb-sm">history</span>
                    <h2 class="font-headline-md text-headline-md text-on-surface">ROUND COMPLETE</h2>
                    <p class="text-outline-variant mt-xs">Calculations successful. Returning to board...</p>
                </div>
            `;
        }

        // Handle physical keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') addNumber(e.key);
            if (e.key === 'Backspace') clearInput();
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body></html>
